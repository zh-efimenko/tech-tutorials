# Docker Compose для практики курса spring-boot-docker-compose
# Spring Boot автоматически обнаружит этот файл и поднимет сервисы при запуске приложения

services:

  # --- База данных ---
  db:
    image: postgres:18.4
    container_name: course_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Кеш ---
  redis:
    image: redis:8.10
    container_name: course_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Брокер сообщений (KRaft, без ZooKeeper) ---
  kafka:
    image: apache/kafka:4.3.1
    container_name: course_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Распределённый кеш (кластер из 2 нод) ---
  hz_1:
    image: hazelcast/hazelcast:5.7
    container_name: course_hazelcast_1
    ports:
      - "5701:5701"
    environment:
      HZ_CLUSTERNAME: course
      HZ_NETWORK_PUBLICADDRESS: hz_1:5701
      HZ_NETWORK_JOIN_AUTO-DETECTION_ENABLED: false
      HZ_NETWORK_JOIN_TCP-IP_ENABLED: true
      HZ_NETWORK_JOIN_TCP-IP_MEMBERS: hz_1:5701,hz_2:5701

  hz_2:
    image: hazelcast/hazelcast:5.7
    container_name: course_hazelcast_2
    ports:
      - "5702:5701"
    environment:
      HZ_CLUSTERNAME: course
      HZ_NETWORK_PUBLICADDRESS: hz_2:5701
      HZ_NETWORK_JOIN_AUTO-DETECTION_ENABLED: false
      HZ_NETWORK_JOIN_TCP-IP_ENABLED: true
      HZ_NETWORK_JOIN_TCP-IP_MEMBERS: hz_1:5701,hz_2:5701
    labels:
      # Spring Boot игнорирует этот сервис при автоконфигурации
      org.springframework.boot.ignore: true

  # --- UI для Hazelcast ---
  hazelcast-management:
    image: hazelcast/management-center:5.11.0
    container_name: course_hazelcast_management
    ports:
      - "5700:8080"
    environment:
      MC_DEFAULT_CLUSTER: course
      MC_DEFAULT_CLUSTER_MEMBERS: hz_1:5701,hz_2:5701
    labels:
      # Spring Boot не знает, как подключиться к Management Center — игнорируем
      org.springframework.boot.ignore: true
